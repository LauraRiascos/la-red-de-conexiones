<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 53 224 224" role="img" ><title>Tobías, un niño de cabello rubio y camisa azul, sonríe</title>
        <style>
.lab-tobias__disco{fill:#e7edff}
.lab-tobias__cabeza{animation:alegre 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.lab-tobias__ojos{animation:parpadear 4s infinite;transform-box:fill-box;transform-origin:center}
.lab-tobias__carta{animation:mostrar 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}
.lab-tobias__brillos path{transform-box:fill-box;transform-origin:center;animation:brillo 1.8s ease-in-out infinite}
.lab-tobias__brillos path:nth-child(2){animation-delay:.6s}
@keyframes alegre{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes parpadear{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes mostrar{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-6deg) translateY(-6px)}}
@keyframes brillo{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
