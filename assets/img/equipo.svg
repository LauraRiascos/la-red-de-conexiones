<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 600 270" role="img"><title>Tobías, Leo y Sofía, juntos y sonrientes, celebran la red</title>
<style>
.p{animation:balanceo 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.p2{animation-delay:-1.1s}.p3{animation-delay:-2.1s}
.cab{animation:asentir 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
.cabS{animation:asentir 3.2s ease-in-out -2.1s infinite;transform-box:view-box;transform-origin:110px 170px}
.ojo{animation:parpadeo 4.4s infinite;transform-box:fill-box;transform-origin:center}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.d2{animation-delay:-.9s}.d3{animation-delay:-1.7s}
@keyframes balanceo{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg) translateY(-3px)}}
@keyframes asentir{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes parpadeo{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
