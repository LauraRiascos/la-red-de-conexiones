<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img"><title>Leo, contento, levanta el pulgar</title><style>
.tb-arm{transform-box:fill-box;transform-origin:18% 84%;animation:tbThumb 2.4s ease-in-out .6s infinite}
.tb-tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.tb-d2{animation-delay:-.9s}.tb-d3{animation-delay:-1.7s}
.lp-head{transform-box:fill-box;transform-origin:50% 92%;animation:nod 3.2s ease-in-out infinite}
@keyframes tbThumb{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(2deg)}45%{transform:rotate(0)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg) translateY(1px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
