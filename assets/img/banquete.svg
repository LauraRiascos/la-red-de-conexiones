<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"><title>Un plato servido con una campana dorada que se levanta: el gran banquete del aprendizaje</title>
<style>
.tapa{animation:tapa 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:15% 100%}
.vapor path{opacity:0;animation:vapor 3.2s ease-in-out infinite}
.vapor path:nth-child(2){animation-delay:.25s}.vapor path:nth-child(3){animation-delay:.5s}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.d2{animation-delay:-.9s}.d3{animation-delay:-1.7s}
@keyframes tapa{0%,30%,100%{transform:rotate(0) translateY(0)}50%,72%{transform:rotate(-16deg) translateY(-14px)}}
@keyframes vapor{0%,35%{opacity:0;transform:translateY(6px)}55%{opacity:.9}80%,100%{opacity:0;transform:translateY(-12px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="120" cy="128" r="100" fill="#e7edff"/>
<ellipse cx="120" cy="190" rx="86" ry="12" fill="#000087" opacity=".08"/>
<!-- plato -->
<ellipse cx="120" cy="174" rx="84" ry="18" fill="#ffffff" stroke="#c9d3f2" stroke-width="3"/>
<ellipse cx="120" cy="171" rx="58" ry="10" fill="#eef2ff"/>
<!-- comida: red de ideas servida -->
<g>
<path d="M86 166 Q92 140 120 136 Q148 140 154 166 Z" fill="#f5b81c"/>
<path d="M92 162 Q100 146 120 144 Q140 146 148 162" fill="none" stroke="#d99a00" stroke-width="3" stroke-linecap="round"/>
<g stroke="#000087" stroke-width="2" opacity=".55"><path d="M104 156 L120 148 L136 156 M120 148 L120 162"/></g>
<circle cx="104" cy="156" r="4" fill="#2f6fe0"/><circle cx="120" cy="148" r="4" fill="#e8576a"/><circle cx="136" cy="156" r="4" fill="#12a39a"/><circle cx="120" cy="162" r="4" fill="#ffffff" stroke="#000087" stroke-width="1.5"/>
</g>
<g class="vapor" fill="none" stroke="#9fb4f5" stroke-width="3.5" stroke-linecap="round">
<path d="M104 128 q-6 -8 0 -16 q6 -8 0 -16"/><path d="M120 124 q-6 -8 0 -16 q6 -8 0 -16"/><path d="M136 128 q-6 -8 0 -16 q6 -8 0 -16"/>
</g>
<!-- campana -->
<g class="tapa">
<path d="M48 168 Q50 92 120 88 Q190 92 192 168 Z" fill="#f5b81c"/>
<path d="M48 168 Q50 92 120 88 Q88 100 78 168 Z" fill="#ffd66b"/>
<path d="M66 132 Q76 108 100 100" fill="none" stroke="#fff6d6" stroke-width="6" stroke-linecap="round" opacity=".9"/>
<rect x="40" y="164" width="160" height="10" rx="5" fill="#d99a00"/>
<path d="M108 88 q0 -16 12 -16 q12 0 12 16" fill="#d99a00"/>
<circle cx="120" cy="70" r="8" fill="#d99a00"/><circle cx="117" cy="67" r="2.5" fill="#ffe9a8"/>
</g>
<path class="tw" d="M30 64 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffc94d"/>
<path class="tw d2" d="M204 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#5882f8"/>
<path class="tw d3" d="M212 132 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffc94d"/>
</svg>